<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROS 2 Quiz</title>
  <style>
    :root{--bg:#080b14;--card:rgba(255,255,255,.09);--card2:rgba(255,255,255,.14);--text:#f8fafc;--muted:#aab4c5;--primary:#7c3aed;--success:#22c55e;--danger:#ef4444;--border:rgba(255,255,255,.16);--shadow:0 24px 70px rgba(0,0,0,.35)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(124,58,237,.38),transparent 32rem),radial-gradient(circle at bottom right,rgba(14,165,233,.28),transparent 28rem),var(--bg);display:grid;place-items:center;padding:24px}
    .quiz-shell{width:min(960px,100%);display:grid;grid-template-columns:.8fr 1.2fr;gap:22px;align-items:stretch}.hero-panel,.quiz-card{border:1px solid var(--border);background:var(--card);backdrop-filter:blur(18px);border-radius:28px;box-shadow:var(--shadow)}.hero-panel{padding:30px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.hero-panel:after{content:"";position:absolute;width:210px;height:210px;right:-88px;bottom:-88px;border-radius:999px;background:linear-gradient(135deg,var(--primary),#0ea5e9);opacity:.35}.eyebrow{display:inline-flex;width:fit-content;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;color:#ddd6fe;background:rgba(124,58,237,.18);font-size:14px;font-weight:700}h1{margin:22px 0 12px;font-size:clamp(34px,6vw,58px);line-height:.95;letter-spacing:-.055em}.hero-panel p{color:var(--muted);line-height:1.7;margin:0}.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:28px;position:relative;z-index:1}.stat{border-radius:18px;background:rgba(255,255,255,.08);padding:16px;border:1px solid var(--border)}.stat strong{display:block;font-size:28px;margin-bottom:2px}.stat span{color:var(--muted);font-size:13px}.quiz-card{padding:28px}.top-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}#progressText,#scoreText{color:var(--muted);font-weight:700;font-size:14px}.progress-track{height:12px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:26px}#progressBar{width:0%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary),#06b6d4);transition:width .26s ease}#question{margin:0 0 22px;font-size:clamp(22px,3.5vw,31px);line-height:1.25;letter-spacing:-.035em}.answers{display:grid;gap:12px}.answer-btn,.action-btn{width:100%;border:1px solid var(--border);border-radius:18px;padding:16px 18px;font-size:16px;font-weight:750;color:var(--text);cursor:pointer;transition:transform .18s ease,border .18s ease,background .18s ease}.answer-btn{display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;background:rgba(255,255,255,.075)}.answer-btn:hover:not(:disabled),.answer-btn:focus-visible:not(:disabled){transform:translateY(-2px);background:var(--card2);border-color:rgba(167,139,250,.75);outline:none}.answer-btn:disabled{cursor:not-allowed}.answer-btn.correct{border-color:rgba(34,197,94,.9);background:rgba(34,197,94,.18)}.answer-btn.wrong{border-color:rgba(239,68,68,.9);background:rgba(239,68,68,.18)}.key{flex:0 0 auto;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.12);color:#d8b4fe;font-size:13px}#feedback{min-height:32px;margin:18px 0 0;font-size:18px;font-weight:800}.actions{display:flex;gap:12px;margin-top:18px}.action-btn{background:linear-gradient(135deg,var(--primary),#0ea5e9)}.action-btn.secondary{background:rgba(255,255,255,.08)}.hidden{display:none!important}.finish-screen{text-align:center;padding:18px 0 8px}.finish-screen h2{font-size:clamp(30px,5vw,46px);margin:0 0 10px;letter-spacing:-.045em}.finish-screen p{color:var(--muted);font-size:18px;line-height:1.7}@media(max-width:820px){.quiz-shell{grid-template-columns:1fr}.hero-panel{min-height:auto}}@media(max-width:540px){body{padding:12px}.hero-panel,.quiz-card{border-radius:22px;padding:22px}.top-row,.actions{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body>
  <main class="quiz-shell">
    <section class="hero-panel" aria-label="Quiz introduction">
      <div><span class="eyebrow">⚙️ ROS 2 Practice</span><h1>Quiz your robotics basics.</h1><p>Answer each question, get instant feedback, and restart anytime. Use keys 1–4 to answer faster.</p></div>
      <div class="stats-grid"><div class="stat"><strong id="correctCount">0</strong><span>Correct</span></div><div class="stat"><strong id="wrongCount">0</strong><span>Wrong</span></div></div>
    </section>
    <section class="quiz-card" aria-live="polite">
      <div class="top-row"><span id="progressText">Loading questions...</span><span id="scoreText">Score: 0%</span></div>
      <div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div>
      <div id="quizArea"><h2 id="question"></h2><div class="answers" id="answers"></div><p id="feedback"></p><div class="actions"><button class="action-btn hidden" id="nextBtn" type="button">Next question</button><button class="action-btn secondary" id="restartBtn" type="button">Restart quiz</button></div></div>
      <div id="finishArea" class="finish-screen hidden"><h2>Quiz complete 🎉</h2><p id="finalText"></p><button class="action-btn" id="finishRestartBtn" type="button">Try again</button></div>
    </section>
  </main>
<script>
let questions=[],current=0,correct=0,wrong=0,answered=false;
const progressText=document.getElementById("progressText"),progressBar=document.getElementById("progressBar"),scoreText=document.getElementById("scoreText"),questionEl=document.getElementById("question"),answersEl=document.getElementById("answers"),feedbackEl=document.getElementById("feedback"),nextBtn=document.getElementById("nextBtn"),restartBtn=document.getElementById("restartBtn"),finishRestartBtn=document.getElementById("finishRestartBtn"),quizArea=document.getElementById("quizArea"),finishArea=document.getElementById("finishArea"),finalText=document.getElementById("finalText"),correctCount=document.getElementById("correctCount"),wrongCount=document.getElementById("wrongCount");
fetch("questions.json")
  .then(r=>{if(!r.ok)throw new Error("Could not load questions.json");return r.json()})
  .then(data=>{
    questions=shuffle(data.map(item=>({
      q:item.q ?? item.question,
      answers:item.answers ?? item.options,
      correct:typeof item.correct==="number" ? item.correct : item.correctAnswer.charCodeAt(0)-65
    })));
    loadQuestion();
  })
  .catch(e=>{progressText.innerText="Error loading questions";questionEl.innerText="Make sure questions.json is in the same folder as index.html.";console.error(e)});
function shuffle(items){for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}
function loadQuestion(){answered=false;const q=questions[current];quizArea.classList.remove("hidden");finishArea.classList.add("hidden");nextBtn.classList.add("hidden");feedbackEl.innerText="";questionEl.innerText=q.q;answersEl.innerHTML="";q.answers.forEach((answer,index)=>{const b=document.createElement("button");b.className="answer-btn";b.type="button";b.innerHTML=`<span>${answer}</span><span class="key">${index+1}</span>`;b.addEventListener("click",()=>checkAnswer(index));answersEl.appendChild(b)});updateStats()}
function updateStats(){const answeredCount=correct+wrong,percent=answeredCount===0?0:Math.round(correct/answeredCount*100),progressPercent=questions.length===0?0:Math.round(current/questions.length*100);progressText.innerText=`Question ${current+1} / ${questions.length}`;progressBar.style.width=`${progressPercent}%`;scoreText.innerText=`Score: ${percent}%`;correctCount.innerText=correct;wrongCount.innerText=wrong}
function checkAnswer(index){if(answered||questions.length===0)return;answered=true;const q=questions[current],buttons=[...document.querySelectorAll(".answer-btn")],correctIndex=q.correct;buttons.forEach((button,i)=>{button.disabled=true;if(i===correctIndex)button.classList.add("correct");if(i===index&&index!==correctIndex)button.classList.add("wrong")});if(index===correctIndex){correct++;feedbackEl.innerText="Correct — nice work!";feedbackEl.style.color="var(--success)"}else{wrong++;feedbackEl.innerText=`Not quite. Correct answer: ${q.answers[correctIndex]}`;feedbackEl.style.color="var(--danger)"}updateStats();progressBar.style.width=`${Math.round((current+1)/questions.length*100)}%`;nextBtn.classList.remove("hidden");nextBtn.focus()}
function nextQuestion(){current++;current<questions.length?loadQuestion():showFinalScreen()}
function showFinalScreen(){const percent=questions.length===0?0:Math.round(correct/questions.length*100);quizArea.classList.add("hidden");finishArea.classList.remove("hidden");progressText.innerText="Finished";progressBar.style.width="100%";scoreText.innerText=`Final score: ${percent}%`;finalText.innerText=`You answered ${correct} out of ${questions.length} questions correctly.`}
function restartQuiz(){questions=shuffle([...questions]);current=0;correct=0;wrong=0;loadQuestion()}
nextBtn.addEventListener("click",nextQuestion);restartBtn.addEventListener("click",restartQuiz);finishRestartBtn.addEventListener("click",restartQuiz);document.addEventListener("keydown",e=>{const n=Number(e.key);if(!answered&&n>=1&&n<=4)checkAnswer(n-1);if(answered&&e.key==="Enter"&&!nextBtn.classList.contains("hidden"))nextQuestion()});
</script>
</body>
</html>
